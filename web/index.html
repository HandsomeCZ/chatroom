<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室 - 登录</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-icon">&#128172;</div>
        <h1>在线聊天室</h1>
        <p class="subtitle" id="subtitle">登录以继续</p>

        <div class="tabs">
            <button class="tab active" id="tabLogin" onclick="switchTab('login')">登录</button>
            <button class="tab" id="tabRegister" onclick="switchTab('register')">注册</button>
        </div>

        <form id="authForm" onsubmit="submitForm(event)">
            <label for="username">用户名</label>
            <input type="text" id="username" autocomplete="username" placeholder="3-32 个字符" required>

            <label for="password">密码</label>
            <input type="password" id="password" autocomplete="current-password" placeholder="4-64 个字符" required>

            <div class="msg" id="msg"></div>
            <button type="submit" class="primary-btn" id="submitBtn">登录</button>
        </form>
    </div>

    <script src="/auth.js"></script>
</body>
</html>
